<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #FFFFFF; }
    a { color: #1157C6; } a:hover { color: #0C3E92; }
    .pk { font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; }
    .px { font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; }
  </style>
</helmet>

<div class="pk" style="position: relative; width: 665px; height: 1270px; background: #FFFFFF; overflow: hidden; filter: {{tone}}; box-shadow: 0 0 0 1px #E3E6EA;">

  <!-- 掛孔區 · euro slot ＋ pqi 標誌 -->
  <div style="position: absolute; left: 230px; top: 38px; width: 205px; height: 58px;">
    <div style="position: absolute; left: 74px; top: 0; width: 57px; height: 57px; border-radius: 999px; background: #E7EAEE; box-shadow: inset 0 0 0 1px #D6DBE0;"></div>
    <div style="position: absolute; left: 0; top: 24px; width: 205px; height: 34px; border-radius: 999px; background: #E7EAEE; box-shadow: inset 0 0 0 1px #D6DBE0;"></div>
  </div>
  <img src="pqi-logo.jpg" alt="pqi" style="position: absolute; left: 269px; top: 120px; width: 128px; height: 80px; object-fit: contain; mix-blend-mode: multiply;">

  <!-- 色號標示 · SKU 辨識 -->
  <div style="position: absolute; right: 60px; top: 213px; display: flex; align-items: center; gap: 13px;">
    <span style="width: 24px; height: 24px; border-radius: 999px; background: {{dot}}; box-shadow: inset 0 0 0 2px {{dotEdge}};"></span>
    <span class="px" style="font-size: 20px; font-weight: 500; letter-spacing: 0.01em; color: #43494F;">{{skuName}}</span>
  </div>

  <!-- 主視覺 · V1 的接頭角度，滿版裁切 -->
  <div style="position: absolute; left: 45px; top: 285px; width: 575px; height: 540px; border-radius: 22px; background: {{tint}}; overflow: hidden;">
    <img src="v1-angle-hero.jpg" alt="Machined aluminium USB-C connectors" style="position: absolute; left: 0; top: 0; width: 575px; height: 540px; object-fit: cover; object-position: 50% 4%; mix-blend-mode: multiply;">
  </div>

  <!-- 圓形小圖 · 主圖講質感，小圖講長度 -->
  <div style="position: absolute; left: 397px; top: 662px; width: 206px; height: 206px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 0 0 9px #FFFFFF, 0 10px 26px -14px rgba(23,24,27,.42); overflow: hidden;">
    <img src="cable-hero.jpg" alt="1.2 m coiled cable" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(1.08); width: 206px; height: 206px; object-fit: contain; mix-blend-mode: multiply;">
  </div>

  <!-- 賣點圖標 · 兩條，480 Mbps 已移至背面 -->
  <div style="position: absolute; left: 60px; top: 896px; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <span style="width: 56px; height: 56px; border-radius: 999px; background: #E6EEFA; display: grid; place-items: center;">
        <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#1157C6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5Z"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 3px;">
        <span class="px" style="font-size: 20px; font-weight: 600; color: #17181B; letter-spacing: 0.005em;">100W Fast Charging</span>
        <span class="px" style="font-size: 17px; font-weight: 400; color: #6E767F;">E-Marker chip built in</span>
      </span>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <span style="width: 56px; height: 56px; border-radius: 999px; background: #E6EEFA; display: grid; place-items: center;">
        <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#1157C6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20"></path><path d="M6 8.5 2.5 12 6 15.5"></path><path d="M18 8.5 21.5 12 18 15.5"></path><path d="M12 6.5v11"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 3px;">
        <span class="px" style="font-size: 20px; font-weight: 600; color: #17181B; letter-spacing: 0.005em;">1.2 m Extended Reach</span>
        <span class="px" style="font-size: 17px; font-weight: 400; color: #6E767F;">Desk, sofa or power bank</span>
      </span>
    </div>
  </div>

  <!-- 第二徽章 · 差異化錨點（待實測報告到位） -->
  <div style="position: absolute; left: 60px; top: 1074px; display: inline-flex; align-items: center; gap: 9px; padding: 10px 16px; border: 2px solid #17181B; border-radius: 5px;">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#17181B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c0-7 4-12 9-12a5 5 0 0 1 0 10c-3 0-4-2-4-4"></path></svg>
    <span class="px" style="font-size: 18px; font-weight: 600; letter-spacing: 0.085em; color: #17181B;">10,000-BEND TESTED</span>
  </div>

  <!-- 主徽章 · 全稿唯一的品牌藍色塊 -->
  <div style="position: absolute; left: 372px; top: 880px; width: 233px; height: 258px; border-radius: 9px; background: #1157C6; display: flex; flex-direction: column; justify-content: center; gap: 0; padding: 0 24px;">
    <span class="px" style="font-size: 15px; font-weight: 600; letter-spacing: 0.11em; white-space: nowrap; color: #BFD3F2;">PD 3.0</span>
    <div style="display: flex; align-items: baseline; gap: 4px; padding-top: 5px;">
      <span style="font-size: 86px; font-weight: 800; line-height: 0.9; letter-spacing: -0.035em; color: #FFFFFF;">100</span>
      <span style="font-size: 44px; font-weight: 600; line-height: 0.9; color: #FFFFFF;">W</span>
    </div>
    <div style="height: 1px; background: rgba(255,255,255,.34); margin: 18px 0 16px;"></div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 50px; font-weight: 700; line-height: 0.94; letter-spacing: -0.02em; color: #FFFFFF;">1.2M</span>
      <span class="px" style="font-size: 19px; font-weight: 500; letter-spacing: 0.05em; color: #C6D8F4;">USB-C to C</span>
    </div>
  </div>

  <!-- 底部鎖定 -->
  <div style="position: absolute; left: 60px; right: 60px; top: 1146px; display: flex; flex-direction: column; gap: 8px;">
    <span class="px" style="font-size: 15px; font-weight: 600; letter-spacing: 0.19em; color: #949BA3;">CMC SERIES</span>
    <span style="font-size: 43px; font-weight: 700; letter-spacing: -0.018em; line-height: 1.06; color: #17181B; white-space: nowrap;">Braided USB-C Cable</span>
    <span class="px" style="font-size: 19px; font-weight: 400; letter-spacing: 0.005em; color: #5D656E; white-space: nowrap;">100W Fast Charging&nbsp; ·&nbsp; Aluminum Shell&nbsp; ·&nbsp; Nylon Braided</span>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":665,"height":1270},"sku":{"editor":"enum","options":["white","black","navy"],"default":"white","section":"SKU"},"grayscale":{"editor":"boolean","default":false,"section":"SKU"}}'>
class Component extends DCLogic {
  renderVals() {
    const sku = this.props.sku ?? 'white';
    const map = {
      white: { tint: '#EDF0F3', dot: '#FFFFFF', dotEdge: '#C4CAD1', skuName: 'Braided White' },
      black: { tint: '#F1EFEC', dot: '#26282B', dotEdge: '#26282B', skuName: 'Braided Black' },
      navy:  { tint: '#EBF0F8', dot: '#2C4C7C', dotEdge: '#2C4C7C', skuName: 'Braided Navy' }
    };
    const s = map[sku] || map.white;
    return {
      tint: s.tint,
      dot: s.dot,
      dotEdge: s.dotEdge,
      skuName: s.skuName,
      tone: (this.props.grayscale ?? false) ? 'grayscale(1)' : 'none'
    };
  }
}
</script>
</body>
</html>
