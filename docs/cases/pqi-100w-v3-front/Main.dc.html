<!doctype html>
<html>

<x-dc>

  <div style="display: flex; flex-direction: column; gap: 16px; padding-bottom: 26px; border-bottom: 2px solid #17181B;">

    <span class="pk" style="font-size: 42px; font-weight: 700; letter-spacing: -0.02em; color: #17181B;">pqi Braided USB-C Cable</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px 34px; font-size: 16px; color: #57606B;">
      <span>正面 ＋ 側標｜CMC Series</span>

      <span>白色 SKU</span>

  </div>

  <div style="display: flex; align-items: flex-start; gap: 62px;">

      <div style="width: 665px; height: 1270px;">
        <dc-import name="Front" sku="white" hint-size="665px,1270px"></dc-import>

      <span class="px" style="font-size: 15px; font-weight: 600; letter-spacing: 0.14em; color: #8A9199;">FRONT PANEL</span>

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div style="width: 189px; height: 1270px;">
        <dc-import name="Spine" sku="white" hint-size="189px,1270px"></dc-import>
      </div>
      <span class="px" style="font-size: 15px; font-weight: 600; letter-spacing: 0.14em; color: #8A9199;">SPINE 25 mm</span>
    </div>
  </div>

  <div style="margin-top: auto; padding-top: 22px; border-top: 1px solid #E1E5E9; display: flex; flex-direction: column; gap: 7px; font-size: 15px; line-height: 1.7; color: #6E767F;">
    <span>照片為比稿素材暫代，正式稿需重拍：單一側逆光、冷白調、地面淺投影，鋁殼高光須保留。</span>
    <span>「10,000-BEND TESTED」徽章待實測報告與測試方法確認後才可上稿。</span>
  </div>
