<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Hero 改版 B — 整合重排版（主推：左文右圖＋底部數據列）</title>
<style>
  :root{
    --purple:      #6C4FA1;
    --purple-deep: #5B4691;
    --gold:        #8A6A1F;
    --ink:         #3A3F4A;
    --muted:       #6B7280;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"WenQuanYi Zen Hei","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}

  .hero{
    position:relative;width:1920px;height:860px;overflow:hidden;
    background:
      radial-gradient(900px 600px at 80% 20%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%),
      radial-gradient(1100px 700px at 10% 90%, rgba(255,255,255,.35), rgba(255,255,255,0) 55%),
      linear-gradient(118deg,#E3EAF4 0%, #D5DFEE 46%, #C7D3E6 100%);
  }
  .leaf{position:absolute;border-radius:50% 50% 45% 55%/60% 45% 55% 40%;
        background:rgba(120,140,175,.10);filter:blur(28px)}
  .leaf.l1{width:520px;height:220px;left:80px;top:50px;transform:rotate(-24deg)}
  .leaf.l2{width:560px;height:230px;right:140px;top:70px;transform:rotate(20deg)}

  /* ── 左欄：唯一的文字欄（眉標 → H1 → 副標 → CTA，一條視線動線）── */
  .copy{position:absolute;left:170px;top:118px;width:840px}
  .eyebrow{
    display:inline-block;font-size:22px;font-weight:600;letter-spacing:4px;
    color:var(--purple);background:rgba(255,255,255,.7);
    border:1px solid rgba(108,79,161,.35);border-radius:999px;
    padding:8px 26px;margin-bottom:30px;
  }
  h1{
    font-size:96px;line-height:1.2;font-weight:800;color:var(--purple-deep);
    letter-spacing:6px;margin-bottom:24px;
  }
  .sub{
    font-size:30px;font-weight:500;color:var(--ink);letter-spacing:4px;
    margin-bottom:46px;
  }
  .cta-row{display:flex;align-items:center;gap:36px}
  .cta{
    display:flex;align-items:center;gap:16px;
    background:var(--purple);color:#fff;
    font-size:31px;font-weight:700;letter-spacing:5px;
    padding:25px 54px;border-radius:16px;
    box-shadow:0 12px 34px rgba(108,79,161,.38);
  }
  .cta .arrow{font-size:27px;letter-spacing:0}
  .cta-sec{
    font-size:23px;color:var(--ink);letter-spacing:3px;
    border-bottom:2px solid rgba(58,63,74,.5);padding-bottom:4px;
  }

  /* ── 右側：產品視覺區（單一視覺主體）───────────────── */
  .ph-podium{position:absolute;right:230px;top:430px;width:620px;height:200px;border-radius:50%;
      background:radial-gradient(ellipse at 50% 42%, rgba(255,255,255,.6), rgba(214,224,238,.2) 70%);
      filter:blur(2px)}
  .ph{position:absolute;border:2px dashed rgba(107,114,128,.4);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
      text-align:center;padding:0 30px;
      color:rgba(107,114,128,.75);font-size:20px;letter-spacing:2px;line-height:1.7;
      background:rgba(255,255,255,.16)}
  .ph small{font-size:15px;letter-spacing:1px;opacity:.85}
  .ph-main{right:330px;top:70px;width:420px;height:440px;border-radius:200px 200px 32px 32px}

  /* ── 底部數據列：全部次要資訊收進一條安靜的橫帶 ───────── */
  .strip{
    position:absolute;left:0;right:0;bottom:0;height:145px;
    background:rgba(255,255,255,.72);
    border-top:1px solid rgba(255,255,255,.9);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 -6px 24px rgba(90,105,140,.10);
  }
  .cell{padding:0 42px;text-align:center}
  .cell + .cell{border-left:1px solid rgba(107,114,128,.25)}
  .cell .k{font-size:18px;color:var(--muted);letter-spacing:2px;margin-bottom:9px}
  .cell .v{font-size:33px;font-weight:800;color:var(--purple-deep);letter-spacing:1px;white-space:nowrap}
  .cell .v small{font-size:19px;font-weight:600;color:var(--ink);margin-right:8px;letter-spacing:2px}
  .cell.prod .v{font-size:22px;font-weight:600;color:var(--ink);letter-spacing:1px;line-height:1.5}
</style>
</head>
<body>
<div class="hero">
  <div class="leaf l1"></div><div class="leaf l2"></div>

  <div class="copy">
    <span class="eyebrow">支持者口碑見證 ・ <span style="color:var(--gold)">人氣</span>排行榜</span>
    <h1>噴噴熱賣<br>募資好物</h1>
    <div class="sub">集氣敲碗，限量再登場！</div>
    <div class="cta-row">
      <div class="cta">逛募資熱銷商品<span class="arrow">→</span></div>
      <div class="cta-sec">所有商品</div>
    </div>
  </div>

  <div class="ph-podium"></div>
  <div class="ph ph-main">產品主圖<small>（單一主體：其餘小物<br>移到底部資訊列或輪播）</small></div>

  <div class="strip">
    <div class="cell">
      <div class="k">LUNA Mag ・ 人氣熱銷</div>
      <div class="v"><small>募資總人數</small>1,010 人</div>
    </div>
    <div class="cell">
      <div class="k">散熱多埠集線 ・ 募資金榜</div>
      <div class="v"><small>募資金額</small>$5,194,681</div>
    </div>
    <div class="cell prod">
      <div class="k">熱銷選品</div>
      <div class="v">Wokyis M5 迷你螢幕擴充</div>
    </div>
    <div class="cell prod">
      <div class="k">熱銷選品</div>
      <div class="v">智慧無線充電極光屋</div>
    </div>
    <div class="cell prod">
      <div class="k">熱銷選品</div>
      <div class="v">SSD 外接盒 魔術 Cube</div>
    </div>
  </div>
</div>
</body>
</html>
