<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Hero 改版 C — 全產品陳列版（一大四小主從構圖，數據進卡片）</title>
<style>
  :root{
    --purple:      #6C4FA1;
    --purple-deep: #5B4691;
    --gold:        #8A6A1F;
    --ink:         #3A3F4A;
    --muted:       #6B7280;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"WenQuanYi Zen Hei","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}

  .hero{
    position:relative;width:1920px;height:860px;overflow:hidden;
    background:
      radial-gradient(900px 600px at 72% 18%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%),
      radial-gradient(1100px 700px at 10% 90%, rgba(255,255,255,.35), rgba(255,255,255,0) 55%),
      linear-gradient(118deg,#E3EAF4 0%, #D5DFEE 46%, #C7D3E6 100%);
  }
  .leaf{position:absolute;border-radius:50% 50% 45% 55%/60% 45% 55% 40%;
        background:rgba(120,140,175,.10);filter:blur(28px)}
  .leaf.l1{width:520px;height:220px;left:60px;top:40px;transform:rotate(-24deg)}
  .leaf.l2{width:560px;height:230px;right:160px;top:40px;transform:rotate(20deg)}

  /* ── 左欄：唯一文字欄（眉標 → H1 → 副標 → CTA）──────── */
  .copy{position:absolute;left:150px;top:150px;width:640px}
  .eyebrow{
    display:inline-block;font-size:21px;font-weight:600;letter-spacing:4px;
    color:var(--purple);background:rgba(255,255,255,.7);
    border:1px solid rgba(108,79,161,.35);border-radius:999px;
    padding:8px 24px;margin-bottom:30px;
  }
  .eyebrow .gold{color:var(--gold)}
  h1{
    font-size:88px;line-height:1.22;font-weight:800;color:var(--purple-deep);
    letter-spacing:6px;margin-bottom:22px;
  }
  .sub{font-size:28px;font-weight:500;color:var(--ink);letter-spacing:4px;margin-bottom:46px}
  .cta-row{display:flex;align-items:center;gap:34px}
  .cta{
    display:flex;align-items:center;gap:15px;
    background:var(--purple);color:#fff;
    font-size:30px;font-weight:700;letter-spacing:5px;
    padding:24px 50px;border-radius:16px;
    box-shadow:0 12px 34px rgba(108,79,161,.38);
  }
  .cta .arrow{font-size:26px;letter-spacing:0}
  .cta-sec{
    font-size:22px;color:var(--ink);letter-spacing:3px;
    border-bottom:2px solid rgba(58,63,74,.5);padding-bottom:4px;
  }

  /* ── 右側陳列區：一大（主打）＋ 四小（同款卡）─────────── */
  .tag{
    display:inline-block;font-size:15px;font-weight:600;color:var(--purple);
    border:1.5px solid var(--purple);border-radius:999px;padding:3px 13px;letter-spacing:2px;
  }
  .shot{
    border:2px dashed rgba(107,114,128,.38);border-radius:16px;
    background:rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;
    color:rgba(107,114,128,.6);font-size:15px;letter-spacing:1px;
  }

  /* 主打卡：LUNA Mag（尺寸 ≈ 配角卡 2 倍以上） */
  .featured{
    position:absolute;left:830px;top:110px;width:420px;height:640px;
    background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.95);
    border-radius:24px;box-shadow:0 14px 40px rgba(90,105,140,.18);
    display:flex;flex-direction:column;align-items:center;
    padding:26px 28px 30px;
  }
  .featured .head{width:100%;display:flex;justify-content:space-between;align-items:center}
  .featured .shot{width:100%;flex:1;margin:20px 0 22px;border-radius:150px 150px 20px 20px}
  .featured .name{font-size:34px;font-weight:800;color:var(--ink);letter-spacing:2px;margin-bottom:10px}
  .featured .num{font-size:40px;font-weight:800;color:var(--purple-deep);letter-spacing:1px}
  .featured .num small{font-size:19px;font-weight:600;color:var(--muted);letter-spacing:2px;margin-right:10px}

  /* 配角卡 ×4：完全同款（重複的秩序） */
  .grid{
    position:absolute;left:1285px;top:110px;width:505px;height:640px;
    display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:24px;
  }
  .card{
    background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.92);
    border-radius:20px;box-shadow:0 8px 24px rgba(90,105,140,.13);
    display:flex;flex-direction:column;align-items:center;
    padding:18px 18px 16px;
  }
  .card .shot{width:100%;flex:1;margin-bottom:14px}
  .card .name{font-size:20px;font-weight:600;color:var(--ink);letter-spacing:1px;
      text-align:center;line-height:1.45}
  .card .num{font-size:21px;font-weight:800;color:var(--purple-deep);margin-top:6px;letter-spacing:0.5px}
  .card .num small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:1px;margin-right:6px}
</style>
</head>
<body>
<div class="hero">
  <div class="leaf l1"></div><div class="leaf l2"></div>

  <div class="copy">
    <span class="eyebrow">支持者口碑見證 ・ <span class="gold">人氣</span>排行榜</span>
    <h1>噴噴熱賣<br>募資好物</h1>
    <div class="sub">集氣敲碗，限量再登場！</div>
    <div class="cta-row">
      <div class="cta">逛募資熱銷商品<span class="arrow">→</span></div>
      <div class="cta-sec">所有商品</div>
    </div>
  </div>

  <div class="featured">
    <div class="head">
      <span class="tag">人氣熱銷 No.1</span>
    </div>
    <div class="shot">（LUNA Mag 產品照）</div>
    <div class="name">LUNA Mag</div>
    <div class="num"><small>募資總人數</small>1,010 人</div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="shot">（產品照）</div>
      <div class="name">散熱多埠集線</div>
      <div class="num"><small>募資金榜</small>$5,194,681</div>
    </div>
    <div class="card">
      <div class="shot">（產品照）</div>
      <div class="name">Wokyis M5<br>迷你螢幕擴充</div>
    </div>
    <div class="card">
      <div class="shot">（產品照）</div>
      <div class="name">智慧無線充電極光屋</div>
    </div>
    <div class="card">
      <div class="shot">（產品照）</div>
      <div class="name">SSD外接盒 魔術Cube</div>
    </div>
  </div>
</div>
</body>
</html>
