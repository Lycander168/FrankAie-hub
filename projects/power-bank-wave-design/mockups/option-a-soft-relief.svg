<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" font-family="'PingFang TC','Noto Sans TC',sans-serif">
  <defs>
    <linearGradient id="bodyA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE7DA"/>
      <stop offset="1" stop-color="#DDD6C6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="620" fill="#FAF8F4"/>
  <text x="200" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#3A362E">方案 A｜淺浮雕柔波（Soft Relief）★</text>

  <!-- body -->
  <rect x="70" y="60" width="260" height="440" rx="58" fill="url(#bodyA)" stroke="#C4BBA6" stroke-width="2"/>

  <!-- shallow relief serpentine: soft, low-contrast, larger bend radius -->
  <g fill="none" stroke-linecap="round">
    <path d="M140,155 H230 a42,42 0 0 1 0,84 H170 a42,42 0 0 0 0,84 H230 a42,42 0 0 1 0,84 H160"
          stroke="#C9C1AD" stroke-width="46" opacity="0.9"/>
    <path d="M140,155 H230 a42,42 0 0 1 0,84 H170 a42,42 0 0 0 0,84 H230 a42,42 0 0 1 0,84 H160"
          stroke="#BDB49E" stroke-width="30" opacity="0.55"/>
    <path d="M140,161 H230 a39,39 0 0 1 0,74 H170 a39,39 0 0 0 0,74 H230 a39,39 0 0 1 0,74 H160"
          stroke="#F4EFE3" stroke-width="5" opacity="0.9"/>
  </g>

  <!-- LED display -->
  <rect x="272" y="86" width="42" height="26" rx="8" fill="#14161A"/>
  <text x="293" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#5FD4FF">86</text>

  <!-- annotations -->
  <g font-size="12" fill="#2F6B3A">
    <text x="200" y="536" text-anchor="middle">✔ 溝深 ≤1.2mm・大 R 淺盤底：一擦即淨</text>
    <text x="200" y="556" text-anchor="middle">✔ 低陰影對比 → 消除「電熱片」聯想，保留迴紋識別</text>
  </g>
  <text x="200" y="586" text-anchor="middle" font-size="12" fill="#6B6455">定位：大眾主力推薦｜防滑握位＋迴紋導流散熱敘事，與原深雕版並行雙版本</text>
</svg>
