<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" font-family="'PingFang TC','Noto Sans TC',sans-serif">
  <defs>
    <linearGradient id="bodyC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE7DA"/>
      <stop offset="1" stop-color="#D9D2C2"/>
    </linearGradient>
    <linearGradient id="grooveC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#948C77"/>
      <stop offset="1" stop-color="#AFA692"/>
    </linearGradient>
  </defs>
  <rect width="400" height="620" fill="#FAF8F4"/>
  <text x="200" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#3A362E">方案 C｜功能迴紋・收線槽（Functional Loop）★</text>

  <!-- body -->
  <rect x="70" y="60" width="260" height="440" rx="58" fill="url(#bodyC)" stroke="#C4BBA6" stroke-width="2"/>

  <!-- widened functional groove (serpentine) -->
  <g fill="none" stroke-linecap="round">
    <path d="M140,150 H235 a37,37 0 0 1 0,74 H165 a37,37 0 0 0 0,74 H235 a37,37 0 0 1 0,74 H165 a37,37 0 0 0 0,74 H245"
          stroke="url(#grooveC)" stroke-width="46"/>
    <path d="M140,150 H235 a37,37 0 0 1 0,74 H165 a37,37 0 0 0 0,74 H235 a37,37 0 0 1 0,74 H165 a37,37 0 0 0 0,74 H245"
          stroke="#7E7662" stroke-width="34" opacity="0.7"/>
  </g>

  <!-- USB-C cable seated inside the groove -->
  <g fill="none" stroke-linecap="round">
    <path d="M150,150 H235 a37,37 0 0 1 0,74 H165 a37,37 0 0 0 0,74 H235 a37,37 0 0 1 0,74 H165 a37,37 0 0 0 0,74 H230"
          stroke="#4A4E57" stroke-width="13"/>
    <path d="M150,147 H235 a37,37 0 0 1 0,74 H165 a37,37 0 0 0 0,74 H235 a37,37 0 0 1 0,74 H165 a37,37 0 0 0 0,74 H230"
          stroke="#6B707B" stroke-width="4" opacity="0.9"/>
  </g>
  <!-- USB-C connector at the tail -->
  <rect x="230" y="437" width="34" height="18" rx="7" fill="#2E3138"/>
  <rect x="260" y="441" width="12" height="10" rx="4" fill="#9AA0AB"/>
  <!-- cable head anchor at start -->
  <rect x="132" y="141" width="22" height="18" rx="6" fill="#2E3138"/>

  <!-- LED display -->
  <rect x="272" y="86" width="42" height="26" rx="8" fill="#14161A"/>
  <text x="293" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#5FD4FF">86</text>

  <!-- annotations -->
  <g font-size="12" fill="#2F6B3A">
    <text x="200" y="536" text-anchor="middle">✔ 迴紋溝＝收線槽：自帶 USB-C 短線嵌入收納，不外露</text>
    <text x="200" y="556" text-anchor="middle">✔ 溝槽對應電芯導流散熱：把「怕發熱」翻轉成賣點</text>
  </g>
  <text x="200" y="586" text-anchor="middle" font-size="12" fill="#6B6455">定位：大眾主力推薦｜造型稅 → 「多送一條線」CP 值敘事</text>
</svg>
